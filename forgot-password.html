<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Painel Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700/50">
        <div class="px-8 pt-8 pb-6 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600/20 text-indigo-400 mb-4 text-2xl">
                <i class="fa-solid fa-key"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Esqueceu sua senha?</h1>
            <p class="text-slate-400 text-sm mt-1">Não se preocupe! Digite seu e-mail cadastrado e enviaremos as instruções.</p>
        </div>

        <form id="forgotForm" class="px-8 pb-8 space-y-5" novalidate>
            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail cadastrado</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm"
                        placeholder="seu@email.com">
                </div>
                <p id="emailError" class="text-rose-500 text-xs mt-1 hidden">Por favor, insira um e-mail válido.</p>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center space-x-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800 cursor-pointer">
                <span id="btnText">Enviar instruções</span>
                <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>

        <div id="successMessage" class="hidden px-8 pb-8 text-center space-y-4">
            <div class="p-4 bg-emerald-500/10 border border-emerald-500/20 rounded-xl text-emerald-400 text-sm">
                <i class="fa-solid fa-circle-check text-lg mb-1 block"></i>
                E-mail enviado com sucesso! Verifique sua caixa de entrada e siga as instruções.
            </div>
        </div>

        <div class="px-8 py-4 bg-slate-900/50 border-t border-slate-700/50 text-center">
            <a href="index.html" class="text-xs text-indigo-400 font-medium hover:text-indigo-300 transition-colors inline-flex items-center space-x-1.5">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Voltar para o login</span>
            </a>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
