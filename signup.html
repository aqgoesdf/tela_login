<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Painel Administrativo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl overflow-hidden border border-slate-700/50">
        <div class="px-8 pt-8 pb-6 text-center">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-600/20 text-indigo-400 mb-4 text-2xl">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Crie sua conta</h1>
            <p class="text-slate-400 text-sm mt-1">Preencha os campos abaixo para começar</p>
        </div>

        <form id="signupForm" class="px-8 pb-8 space-y-4" novalidate>
            <div>
                <label for="name" class="block text-sm font-medium text-slate-300 mb-1.5">Nome completo</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-regular fa-user"></i>
                    </span>
                    <input type="text" id="name" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm"
                        placeholder="Seu Nome">
                </div>
                <p id="nameError" class="text-rose-500 text-xs mt-1 hidden">Por favor, insira seu nome completo.</p>
            </div>

            <div>
                <label for="email" class="block text-sm font-medium text-slate-300 mb-1.5">E-mail</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="email" required
                        class="w-full pl-10 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm"
                        placeholder="seu@email.com">
                </div>
                <p id="emailError" class="text-rose-500 text-xs mt-1 hidden">Por favor, insira um e-mail válido.</p>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-300 mb-1.5">Senha</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required
                        class="w-full pl-10 pr-12 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors text-sm"
                        placeholder="••••••••">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-slate-200 transition-colors focus:outline-none cursor-pointer">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>
                <p id="passwordError" class="text-rose-500 text-xs mt-1 hidden">A senha deve ter pelo menos 6 caracteres.</p>
            </div>

            <div class="flex items-start pt-1">
                <input type="checkbox" id="terms" class="mt-0.5 w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-800 cursor-pointer">
                <label for="terms" class="ml-2 text-xs text-slate-300 cursor-pointer">
                    Concordo com os <a href="#" class="text-indigo-400 hover:text-indigo-300">Termos de Serviço</a> e <a href="#" class="text-indigo-400 hover:text-indigo-300">Política de Privacidade</a>
                </label>
            </div>
            <p id="termsError" class="text-rose-500 text-xs hidden">Você deve concordar com os termos para continuar.</p>

            <button type="submit" id="submitBtn"
                class="w-full mt-2 py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-600/30 transition-all duration-200 flex items-center justify-center space-x-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-800 cursor-pointer">
                <span id="btnText">Criar conta</span>
                <i id="btnSpinner" class="fa-solid fa-circle-notch fa-spin hidden"></i>
            </button>
        </form>

        <div class="px-8 py-4 bg-slate-900/50 border-t border-slate-700/50 text-center">
            <p class="text-xs text-slate-400">
                Já tem uma conta? <a href="index.html" class="text-indigo-400 font-medium hover:text-indigo-300 transition-colors">Entre aqui</a>
            </p>
        </div>
    </div>

    <script src="assets/js/script.js"></script>
</body>
</html>
